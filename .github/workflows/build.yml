name: Build

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs: 
  build:
    container:
      # Pinned by digest: image built 2022-05-21, ARM GCC 10.3-2021.07.
      image: ghcr.io/armmbed/mbed-os-env:latest@sha256:302695f5fd9aeb3912f5ed1b9b2e3d6266d9ed8e9c6bfe29f70b77fe20ffced4
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - "sensorwatch_red"
          - "sensorwatch_green"
          - "sensorwatch_blue"
          - "sensorwatch_pro"
        display:
          - "classic"
          - "custom"
    env:
      BOARD: ${{ matrix.board }}
      DISPLAY: ${{ matrix.display }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Ensure workspace directory is defined as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile movement firmware
        run: make
        working-directory: '.'
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.board }}-display-${{ matrix.display }}-movement.uf2
          path: build/firmware.uf2

  build-simulator:
    container:
      # Pinned by digest: Emscripten 6.0.12, multi-arch index (amd64 + arm64).
      image: emscripten/emsdk:6.0.12@sha256:77638e6c215a65f25a704c0c831d5c2463a8c0468a58c6cb82489dbe621dfa05
    strategy:
      matrix:
        board:
          - "sensorwatch_red"
          - "sensorwatch_green"
          - "sensorwatch_blue"
          - "sensorwatch_pro"
        display:
          - "classic"
          - "custom"
    env:
      BOARD: ${{ matrix.board }}
      DISPLAY: ${{ matrix.display }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Ensure workspace directory is defined as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile movement
        run: emmake make
        working-directory: '.'
      - name: Archive simulator build
        working-directory: './build-sim'
        run: |
          tar -czf movement.tar.gz firmware.html firmware.wasm firmware.js
      - name: Upload simulator build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.board }}-display-${{ matrix.display }}-movement.tar.gz
          path: build-sim/movement.tar.gz
